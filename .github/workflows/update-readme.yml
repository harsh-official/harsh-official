name: Update Dynamic README

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual trigger from Actions tab
  push:
    branches: [ main ]
    paths:
      - 'README.template.md'
      - 'update-readme.py'
      - '.github/workflows/update-readme.yml'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser
        
    - name: 🔄 Update README
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        # Optional: Add your custom environment variables here
        BIO: ${{ vars.BIO }}
        CURRENT_PROJECT: ${{ vars.CURRENT_PROJECT }}
        LEARNING: ${{ vars.LEARNING }}
        COLLABORATION: ${{ vars.COLLABORATION }}
        ASK_ME_ABOUT: ${{ vars.ASK_ME_ABOUT }}
        FUN_FACT: ${{ vars.FUN_FACT }}
        BLOG_RSS_URL: ${{ vars.BLOG_RSS_URL }}
        SOCIAL_TWITTER: ${{ vars.SOCIAL_TWITTER }}
        SOCIAL_LINKEDIN: ${{ vars.SOCIAL_LINKEDIN }}
        SOCIAL_YOUTUBE: ${{ vars.SOCIAL_YOUTUBE }}
        SOCIAL_INSTAGRAM: ${{ vars.SOCIAL_INSTAGRAM }}
        SOCIAL_DISCORD: ${{ vars.SOCIAL_DISCORD }}
        SOCIAL_WEBSITE: ${{ vars.SOCIAL_WEBSITE }}
      run: python update-readme.py
      
    - name: 🚀 Commit and Push Changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add README.md
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🤖 Update dynamic README - $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        fi